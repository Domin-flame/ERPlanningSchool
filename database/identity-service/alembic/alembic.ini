[alembic]
script_location = .
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =
; L'URL réelle est injectée par env.py depuis la variable d'environnement
; DATABASE_URL (voir env.py) — ne jamais committer d'URL avec mot de passe ici.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
