# Upgrade HTTP → WebSocket pour /api/ws/* (notifications et messagerie temps réel).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip pour de meilleures performances
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA : tout renvoie vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets statiques hâchés
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

# Reverse proxy vers le backend.
    # BACKEND_UPSTREAM est injecté via envsubst (voir Dockerfile / entrypoint.sh).
    # On stocke l'URL dans une variable pour que nginx résolve le hostname
    # à la volée (à chaque requête) plutôt qu'au démarrage. Cela évite le crash
    # fatal "host not found in upstream" si le backend n'est pas encore up.
    # Résolveur DNS interne de Docker, requis quand proxy_pass utilise une variable.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream ${BACKEND_UPSTREAM};
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
