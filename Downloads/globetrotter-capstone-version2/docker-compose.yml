version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: globetrotter_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:15-alpine
    container_name: globetrotter_user_db
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  itinerary-db:
    image: postgres:15-alpine
    container_name: globetrotter_itinerary_db
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter
      POSTGRES_DB: itinerary_db
    ports:
      - "5434:5432"
    volumes:
      - itinerary_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter -d itinerary_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  destinations-db:
    image: postgres:15-alpine
    container_name: globetrotter_destinations_db
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter
      POSTGRES_DB: destinations_db
    ports:
      - "5435:5432"
    volumes:
      - destinations_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter -d destinations_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./microservices
      dockerfile: user_service/Dockerfile
    container_name: globetrotter_user_service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+psycopg2://globetrotter:globetrotter@user-db:5432/user_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - SECRET_KEY=globetrotter-secret-change-in-prod
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  itinerary-service:
    build:
      context: ./microservices
      dockerfile: itinerary_service/Dockerfile
    container_name: globetrotter_itinerary_service
    ports:
      - "8002:8002"
    environment:
      - ITINERARY_DATABASE_URL=postgresql+psycopg2://globetrotter:globetrotter@itinerary-db:5432/itinerary_db
      - DESTINATIONS_DATABASE_URL=postgresql+psycopg2://globetrotter:globetrotter@destinations-db:5432/destinations_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - SECRET_KEY=globetrotter-secret-change-in-prod
      - SEED_FILE=data/pois.json
    depends_on:
      itinerary-db:
        condition: service_healthy
      destinations-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  recommendation-service:
    build:
      context: ./microservices
      dockerfile: recommendation_service/Dockerfile
    container_name: globetrotter_recommendation_service
    ports:
      - "8003:8003"
    environment:
      - USER_SERVICE_URL=http://user-service:8001
      - ITINERARY_SERVICE_URL=http://itinerary-service:8002
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - SECRET_KEY=globetrotter-secret-change-in-prod
    depends_on:
      - user-service
      - itinerary-service
      - rabbitmq
    restart: on-failure

  api-gateway:
    build:
      context: ./microservices
      dockerfile: gateway/Dockerfile
    container_name: globetrotter_api_gateway
    ports:
      - "8000:8000"
    environment:
      - USER_SERVICE_URL=http://user-service:8001
      - ITINERARY_SERVICE_URL=http://itinerary-service:8002
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:8003
    depends_on:
      - user-service
      - itinerary-service
      - recommendation-service
    restart: on-failure

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: globetrotter_frontend
    ports:
      - "8081:8081"
    volumes:
      - ./Frontend:/app
    working_dir: /app
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
    command: ["npm", "start"]
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  user_db_data:
  itinerary_db_data:
  destinations_db_data:
