services:
  # ────────────────────────────────────────────────────────────
  # Infrastructure partagée
  # ────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI → http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-campus_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rabbit_pass}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 8
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────
  # PostgreSQL — une base par microservice
  # ────────────────────────────────────────────────────────────

  identity-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: ${DB_USER:-campus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus_pass}
    volumes:
      - identity-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campus_user} -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  academic-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: ${DB_USER:-campus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus_pass}
    volumes:
      - academic-data:/var/lib/postgresql/data
      - ./postgres/academic_schema_tables.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./postgres/donnees_test_academic.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campus_user} -d academic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  finance-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: finance_db
      POSTGRES_USER: ${DB_USER:-campus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus_pass}
    volumes:
      - finance-data:/var/lib/postgresql/data
      - ./postgres/finance_schema_tables.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./postgres/donnees_test_finance.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campus_user} -d finance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hr-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hr_db
      POSTGRES_USER: ${DB_USER:-campus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus_pass}
    volumes:
      - hr-data:/var/lib/postgresql/data
      - ./postgres/hr_schema_tables.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./postgres/donnees_test_hr.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campus_user} -d hr_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  message-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: message_db
      POSTGRES_USER: ${DB_USER:-campus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus_pass}
    volumes:
      - message-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campus_user} -d message_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  notification-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${DB_USER:-campus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus_pass}
    volumes:
      - notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campus_user} -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────
  # Microservices
  # ────────────────────────────────────────────────────────────

  auth-service:
    build: ./module_authentification
    ports:
      - "${AUTH_PORT:-8001}:8001"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-campus_user}:${DB_PASSWORD:-campus_pass}@identity-db:5432/identity_db
      DATABASE_SCHEMA: public
      DB_AUTO_INIT: "true"
      DB_AUTO_SEED: ${DB_AUTO_SEED:-true}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@campus.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://gateway:3000,http://localhost:5173}
    depends_on:
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  academic-service:
    build: ./module_academique
    ports:
      - "${ACADEMIC_PORT:-8002}:8002"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-campus_user}:${DB_PASSWORD:-campus_pass}@academic-db:5432/academic_db
      DATABASE_SCHEMA: academic
      DB_AUTO_INIT: "false"
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-campus_rabbit}:${RABBITMQ_PASS:-rabbit_pass}@rabbitmq:5672/
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://gateway:3000,http://localhost:5173}
    depends_on:
      academic-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  finance-service:
    build:
      context: ./module_finance_marketing/finance-service
      dockerfile: Dockerfile
    ports:
      - "${FINANCE_PORT:-8003}:8003"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-campus_user}:${DB_PASSWORD:-campus_pass}@finance-db:5432/finance_db
      DATABASE_SCHEMA: finance
      DB_AUTO_INIT: "false"
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-campus_rabbit}:${RABBITMQ_PASS:-rabbit_pass}@rabbitmq:5672/
      NOTIFICATION_SERVICE_URL: http://notification-service:8006
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://gateway:3000,http://localhost:5173}
    depends_on:
      finance-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hr-service:
    build: ./module_rh
    ports:
      - "${HR_PORT:-8004}:8004"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-campus_user}:${DB_PASSWORD:-campus_pass}@hr-db:5432/hr_db
      DATABASE_SCHEMA: hr
      DB_AUTO_INIT: "false"
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-campus_rabbit}:${RABBITMQ_PASS:-rabbit_pass}@rabbitmq:5672/
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://gateway:3000,http://localhost:5173}
    depends_on:
      hr-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8004
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  message-service:
    build: ./module_message
    ports:
      - "${MESSAGE_PORT:-8005}:8005"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-campus_user}:${DB_PASSWORD:-campus_pass}@message-db:5432/message_db
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-campus_rabbit}:${RABBITMQ_PASS:-rabbit_pass}@rabbitmq:5672/
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/1
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://gateway:3000,http://localhost:5173}
    depends_on:
      message-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  notification-service:
    build: ./module_notification
    ports:
      - "${NOTIFICATION_PORT:-8006}:8006"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-campus_user}:${DB_PASSWORD:-campus_pass}@notification-db:5432/notification_db
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-campus_rabbit}:${RABBITMQ_PASS:-rabbit_pass}@rabbitmq:5672/
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/2
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://gateway:3000,http://localhost:5173}
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8006
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8006/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────
  # API Gateway
  # ────────────────────────────────────────────────────────────

  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8001}
      ACADEMIC_SERVICE_URL: ${ACADEMIC_SERVICE_URL:-http://academic-service:8002}
      FINANCE_SERVICE_URL: ${FINANCE_SERVICE_URL:-http://finance-service:8003}
      HR_SERVICE_URL: ${HR_SERVICE_URL:-http://hr-service:8004}
      MESSAGE_SERVICE_URL: ${MESSAGE_SERVICE_URL:-http://message-service:8005}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8006}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      auth-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────
  # Frontend — build de production servi par nginx
  # ────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://gateway:3000}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  identity-data:
  academic-data:
  finance-data:
  hr-data:
  message-data:
  notification-data:
