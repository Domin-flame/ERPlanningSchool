version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: academic_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: academic_user
      POSTGRES_PASSWORD: academic_pass
      POSTGRES_DB: academic_db
    ports:
      - "5432:5432"
    volumes:
      - academic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic_user -d academic_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: academic_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://academic_user:academic_pass@db:5432/academic_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  academic_pgdata:
